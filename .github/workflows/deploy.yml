name: Deploy website

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the built website
        uses: actions/checkout@v4
        with:
          repository: StudyStudentAI/studentstudyai-site
          ref: main
          path: site
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}

      - name: Prepare files
        run: |
          rm -rf site/.git site/.github
          touch site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
